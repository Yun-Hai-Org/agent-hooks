# OpenAPI 越权负向用例 — 复制为 openapi-auth-negative.yaml 或 .hooks/openapi-auth-negative.yaml
# 需设置 ZAP_TARGET_URL 或 baseUrl 指向可访问的 staging API
baseUrl: ''
cases:
  - method: GET
    path: /api/admin/users
    headers: {}
    expectStatus: [401, 403]
  - method: GET
    path: /api/admin/users
    headers:
      Authorization: Bearer invalid-token
    expectStatus: [401, 403]
