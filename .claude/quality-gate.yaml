settings:
  coverageThreshold:
    lines: 79
    functions: 80
  scanScope:
    include: []
    exclude:
      - _bmad-output/
      - .github/
      - data/evals/
      - data/
      - dist/
      - build/
      - .pytest_cache/
      - .mypy_cache/
      - htmlcov/
      - coverage/
  pushMergeBranches:
    mode: selected
    include:
      - main
      - master
    exclude: []
  licenseDenylist:
    - GPL-3.0
    - AGPL-3.0
  notifications:
    timeout: 5s
    cooldown: 5m
    channels:
      wechat:
        url: ''
      feishu:
        url: ''
      slack:
        url: ''

