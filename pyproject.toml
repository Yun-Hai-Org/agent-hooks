[project]
name = "hooks-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "D103", "PLR2004", "ANN401", "INP001"]
"scripts/**/*.py" = ["T201", "ANN401", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
  "pip>=26.2",
  "pip-audit>=2.7.0",
  "pyright>=1.1.409",
  "pytest>=8.0.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
# 4-file repo whose hooks_manifest_validator intentionally parses
# untyped JSON (load_json returns Any) and uses a CLI entry returning int.
reportUnusedCallResult = "none"
reportUnknownArgumentType = "none"
